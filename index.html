<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GibbonQuiz</title>
  </head>
  <body>
<div align="left">

<table border="0" cellspacing="0" cellpadding="0" width="100%">
  <tr>
    <td width="50%"><form method="POST" name="instantquiz">
      <table border="0" width="100%" cellspacing="0" cellpadding="0">
        <caption><strong>Pop Quiz: Gibbon Trivia</strong></caption>
        <tr>
          <td width="100%"><div align="center"><center><p><textarea rows="10" name="thequestion"
          cols="69" wrap="virtual"></textarea></td>
        </tr>
        
        <tr align="center">
          <td width="100%"><div align="center"><center><p><strong>Your response:</strong>
          <label><input type="radio" name="theresponse" value="a" onClick="responses()"> a</label>
          <label><input type="radio" name="theresponse" value="b" onClick="responses()"> b</label>
          <label><input type="radio" name="theresponse" value="c" onClick="responses()"> c</label>
          <label><input type="radio" name="theresponse" value="d" onClick="responses()"> d</label>
          <br>

        <tr align="center">
          <td width="50%"><div align="center"><center><p><strong>Comments: </strong><input
          type="text" name="thesolution" size="35" readonly></td>
        </tr>
        
          <input type="button" value="&lt;&lt;Back" name="B1"
          onClick="goBack()"> <input type="button"
          value="Next&gt;&gt;" name="B2"
          onClick="goNext()"><br>
          <small><a href="#" onClick="whichone=1;generatequestions();return false">Start Over</a> </small><input
          type="checkbox" name="cmode" value="ON"><small>Cheat Mode</small><p align="center"><font face="arial" size="-2">This free quiz script provided by</font><br> <font face="arial, helvetica" size="-2"><a href="http://javascriptkit.com">JavaScript Kit</a></font></p></td>
        </tr>
      </table>
    </form>
    </td>
  </tr>
</table>
</div>

<script src="pop.js">

/*
Instant-grading multiple choice quiz-
By JavaScript Kit (javascriptkit.com)
Over 200+ free scripts here!
*/

</script>
<script language="JavaScript1.1">
var whichone=1
var tempmn=document.instantquiz.thequestion
function goBack(){
if (whichone>1){whichone--;generatequestions()}
}
function goNext(){
if (whichone<=total){whichone++;generatequestions()}
}
function generatequestions(){
document.instantquiz.theresponse.selectedIndex=0
if (!document.instantquiz.cmode.checked||whichone>=total+1||whichone<=0)
document.instantquiz.thesolution.value=''
if (whichone>=total+1)
tempmn.value="End of quiz"
else{
tempmn.value=whichone+")"+question[whichone]+"\n\n"+"a)"+eval('choice'+whichone+'[1]')+"\n"+"b)"+eval('choice'+whichone+'[2]')+"\n"+"c)"+eval('choice'+whichone+'[3]')+"\n"+"d)"+eval('choice'+whichone+'[4]')
if (document.instantquiz.cmode.checked)
document.instantquiz.thesolution.value=solution[whichone]
}
}

function responses(){
var temp2=document.instantquiz.theresponse
var temp3=temp2.options[temp2.selectedIndex].text
if (temp3!=solution[whichone]&&temp2.selectedIndex!=0)
document.instantquiz.thesolution.value="Sorry, the correct answer is "+solution[whichone]
else if(temp2.selectedIndex!=0)
document.instantquiz.thesolution.value=compliments[Math.round(Math.random()*compliments.length-1)]
}

generatequestions()
</script>

</script>
    <script src="./script.js"></script>
  </body>
</html>
