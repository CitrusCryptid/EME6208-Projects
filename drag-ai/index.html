<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="../Sidebar.JS" defer></script>
<title>Sort the Instruments</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="drag-ai.css">
</head>
<body>
<main>
  <header>
    <div>
      <h1>Sort the instruments</h1>
      <p class="sub">Drag each instrument into its family. On a touch screen, tap an instrument, then tap a family.</p>
    </div>
    <div class="score" aria-live="polite">
      <div class="stat good"><b id="correct">0</b><span>correct of <span id="total">12</span></span></div>
      <div class="stat bad"><b id="wrong">0</b><span>misses</span></div>
    </div>
  </header>

  <p class="bank-title">Instrument bank</p>
  <div class="bank" id="bank" data-zone="bank"></div>

  <div class="zones" id="zones"></div>

  <div class="bar">
    <p id="msg" aria-live="polite"></p>
    <button class="reset" id="reset" type="button">Reset quiz</button>
  </div>
</main>

<script>

const POOL = {
  Brass: ["Trumpet","Trombone","French horn","Tuba","Cornet","Euphonium","Flugelhorn","Bugle","Sousaphone"],
  Woodwinds: ["Flute","Clarinet","Oboe","Bassoon","Saxophone","Piccolo","English horn","Recorder","Bass clarinet"],
  Percussion: ["Snare drum","Xylophone","Timpani","Cymbals","Triangle","Marimba","Tambourine","Glockenspiel","Bass drum"]
};
const CATS = ["Brass","Woodwinds","Percussion"];
const PER_CAT = 4;

const bank = document.getElementById("bank");
const zonesEl = document.getElementById("zones");
const msg = document.getElementById("msg");
let correct = 0, wrong = 0, selected = null;

function shuffle(a){
  a = a.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function buildZones(){
  zonesEl.innerHTML = "";
  CATS.forEach(cat=>{
    const z = document.createElement("div");
    z.className = "zone"; z.dataset.cat = cat; z.dataset.zone = cat;
    z.innerHTML = `<h2>${cat}<small><span class="n">0</span>/${PER_CAT}</small></h2><div class="items"></div>`;
    zonesEl.appendChild(z);
  });
}

function newRound(){
  correct = 0; wrong = 0; selected = null;
  msg.textContent = "";
  buildZones();
  bank.innerHTML = "";
  const picks = [];
  CATS.forEach(cat=>shuffle(POOL[cat]).slice(0,PER_CAT).forEach(name=>picks.push({name,cat})));
  shuffle(picks).forEach(p=>{
    const c = document.createElement("button");
    c.type = "button"; c.className = "chip"; c.draggable = true;
    c.textContent = p.name; c.dataset.cat = p.cat;
    bank.appendChild(c);
  });
  document.getElementById("total").textContent = picks.length;
  updateScore();
}

function updateScore(){
  document.getElementById("correct").textContent = correct;
  document.getElementById("wrong").textContent = wrong;
}

function attempt(chip, zone){
  if(!chip || !zone || chip.classList.contains("locked")) return;
  const cat = zone.dataset.cat;
  if(!cat) return;
  chip.classList.remove("selected"); selected = null;
  if(chip.dataset.cat === cat){
    chip.classList.add("locked"); chip.draggable = false; chip.disabled = true;
    zone.querySelector(".items").appendChild(chip);
    zone.querySelector(".n").textContent = zone.querySelectorAll(".chip").length;
    correct++;
    msg.textContent = "Yes, " + chip.textContent + " is " + cat.toLowerCase() + ".";
    if(correct === +document.getElementById("total").textContent){
      msg.textContent = wrong === 0
        ? "Perfect score. No misses."
        : "All sorted, with " + wrong + (wrong === 1 ? " miss." : " misses.");
    }
  } else {
    wrong++;
    msg.textContent = chip.textContent + " doesn’t belong in " + cat + ". Try again.";
    chip.classList.remove("shake"); void chip.offsetWidth; chip.classList.add("shake");
    setTimeout(()=>chip.classList.remove("shake"),400);
  }
  updateScore();
}

/* Mouse drag and drop */
let dragged = null;
document.addEventListener("dragstart",e=>{
  const c = e.target.closest(".chip");
  if(!c || c.classList.contains("locked")) return;
  dragged = c; c.classList.add("dragging");
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", c.textContent);
});
document.addEventListener("dragend",()=>{
  if(dragged) dragged.classList.remove("dragging");
  dragged = null;
  document.querySelectorAll(".over").forEach(z=>z.classList.remove("over"));
});
zonesEl.addEventListener("dragover",e=>{
  const z = e.target.closest(".zone");
  if(z){e.preventDefault(); z.classList.add("over");}
});
zonesEl.addEventListener("dragleave",e=>{
  const z = e.target.closest(".zone");
  if(z && !z.contains(e.relatedTarget)) z.classList.remove("over");
});
zonesEl.addEventListener("drop",e=>{
  e.preventDefault();
  const z = e.target.closest(".zone");
  if(z) z.classList.remove("over");
  attempt(dragged, z);
});

/* Tap or keyboard: select a chip, then choose a family */
bank.addEventListener("click",e=>{
  const c = e.target.closest(".chip");
  if(!c) return;
  if(selected) selected.classList.remove("selected");
  if(selected === c){selected = null; return;}
  selected = c; c.classList.add("selected");
  msg.textContent = "Now choose a family for " + c.textContent + ".";
});
zonesEl.addEventListener("click",e=>{
  const z = e.target.closest(".zone");
  if(z && selected) attempt(selected, z);
});

document.getElementById("reset").addEventListener("click",newRound);
newRound();
</script>
</body>
</html>
