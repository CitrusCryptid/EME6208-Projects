<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html>

<head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
<script src="Sidebar.JS" defer></script>
	<title>Drag and Drop Quiz</title>
	
	 <link rel="stylesheet" href="dragdrop-container.css">
	
	
	<script type="text/javascript">
	
	/* VARIABLES YOU COULD MODIFY */
var boxSizeArray = [3,3,3,3,3,3,3];   // How many items fit in each right-column box

var arrow_offsetX = -10;
var arrow_offsetY = 0;
var arrow_offsetX_firefox = -10;
var arrow_offsetY_firefox = 0;

var verticalSpaceBetweenListItems = 12;  // Was 3: too small, clipped the 3rd item

var initShuffleItems = true;
var indicateDestionationByUseOfArrow = true;  // false = dotted drop box instead of arrow
var lockedAfterDrag = false;
/* END VARIABLES YOU COULD MODIFY */

var dragDropTopContainer = false;
var dragTimer = -1;
var dragContentObj = false;
var contentToBeDragged = false;
var contentToBeDragged_src = false;
var contentToBeDragged_next = false;
var destinationObj = false;
var dragDropIndicator = false;
var ulPositionArray = new Array();
var mouseoverObj = false;

var MSIE = navigator.userAgent.indexOf('MSIE')>=0?true:false;
var navigatorVersion = navigator.appVersion.replace(/.*?MSIE (\d\.\d).*/g,'$1')/1;
var destinationBoxes = new Array();
var indicateDestinationBox = false;

function getScrollTop(){
    return Math.max(window.pageYOffset||0, document.documentElement.scrollTop, document.body.scrollTop);
}
    
function getScrollLeft(){
    return Math.max(window.pageXOffset||0, document.documentElement.scrollLeft, document.body.scrollLeft);
}
    
function getTopPos(inputObj)
{
    return inputObj.getBoundingClientRect().top + getScrollTop();
}
    
function getLeftPos(inputObj)
{
    return inputObj.getBoundingClientRect().left + getScrollLeft();
}

function cancelEvent()
{
    return false;
}

/* Re-measure every drop zone so positions are never stale */
function updatePositions()
{
    for(var no=0;no<ulPositionArray.length;no++){
        var ul = ulPositionArray[no]['obj'];
        var r = ul.getBoundingClientRect();
        ulPositionArray[no]['left'] = r.left + getScrollLeft();
        ulPositionArray[no]['top'] = r.top + getScrollTop();
        ulPositionArray[no]['width'] = r.width;
        ulPositionArray[no]['height'] = r.height;
    }
}

function initDrag(e)    // Mouse button is pressed down on a LI
{
    if(document.all)e = event;
    if(lockedAfterDrag && this.parentNode.id!='allItems')return;
    updatePositions();

    var st = Math.max(document.body.scrollTop,document.documentElement.scrollTop);
    var sl = Math.max(document.body.scrollLeft,document.documentElement.scrollLeft);

    dragTimer = 0;
    dragContentObj.style.left = e.clientX + sl + 'px';
    dragContentObj.style.top = e.clientY + st + 'px';
    contentToBeDragged = this;
    contentToBeDragged_src = this.parentNode;
    contentToBeDragged_next = false;
    if(this.nextSibling){
        contentToBeDragged_next = this.nextSibling;
        if(!this.tagName && contentToBeDragged_next.nextSibling)contentToBeDragged_next = contentToBeDragged_next.nextSibling;
    }
    timerDrag();
    return false;
}

function everythingIsCorrect()
{
    alert('Congratulations! Everything is correct');
}

function timerDrag()
{
    if(dragTimer>=0 && dragTimer<10){
        dragTimer++;
        setTimeout(timerDrag,10);
        return;
    }
    if(dragTimer==10){
        dragContentObj.style.display='block';
        dragContentObj.appendChild(contentToBeDragged);
    }
}

function moveDragContent(e)
{
    if(dragTimer<10){
        if(contentToBeDragged){
            if(contentToBeDragged_next){
                contentToBeDragged_src.insertBefore(contentToBeDragged,contentToBeDragged_next);
            }else{
                contentToBeDragged_src.appendChild(contentToBeDragged);
            }
        }
        return;
    }
    if(document.all)e = event;
    var st = Math.max(document.body.scrollTop,document.documentElement.scrollTop);
    var sl = Math.max(document.body.scrollLeft,document.documentElement.scrollLeft);

    dragContentObj.style.left = e.clientX + sl + 'px';
    dragContentObj.style.top = e.clientY + st + 'px';

    if(mouseoverObj)mouseoverObj.className='';
    destinationObj = false;
    dragDropIndicator.style.display='none';
    if(indicateDestinationBox)indicateDestinationBox.style.display='none';
    var x = e.clientX + sl;
    var y = e.clientY + st;
    var width = dragContentObj.offsetWidth;
    var height = dragContentObj.offsetHeight;

    var tmpOffsetX = arrow_offsetX;
    var tmpOffsetY = arrow_offsetY;
    if(!document.all){
        tmpOffsetX = arrow_offsetX_firefox;
        tmpOffsetY = arrow_offsetY_firefox;
    }

    for(var no=0;no<ulPositionArray.length;no++){
        var ul_leftPos = ulPositionArray[no]['left'];
        var ul_topPos = ulPositionArray[no]['top'];
        var ul_height = ulPositionArray[no]['height'];
        var ul_width = ulPositionArray[no]['width'];

       if(x > ul_leftPos && x < (ul_leftPos + ul_width) && y > ul_topPos && y < (ul_topPos + ul_height)){
            var noExisting = ulPositionArray[no]['obj'].getElementsByTagName('LI').length;
            if(indicateDestinationBox && indicateDestinationBox.parentNode==ulPositionArray[no]['obj'])noExisting--;
            if(noExisting<boxSizeArray[no-1] || no==0){
                dragDropIndicator.style.left = ul_leftPos + tmpOffsetX + 'px';
                var subLi = ulPositionArray[no]['obj'].getElementsByTagName('LI');
                for(var liIndex=0;liIndex<subLi.length;liIndex++){
                    var tmpTop = getTopPos(subLi[liIndex]);
                    if(!indicateDestionationByUseOfArrow){
                        if(y<tmpTop){
                            destinationObj = subLi[liIndex];
                            indicateDestinationBox.style.display='block';
                            subLi[liIndex].parentNode.insertBefore(indicateDestinationBox,subLi[liIndex]);
                            break;
                        }
                    }else{
                        if(y<tmpTop){
                            destinationObj = subLi[liIndex];
                            dragDropIndicator.style.top = tmpTop + tmpOffsetY - Math.round(dragDropIndicator.clientHeight/2) + 'px';
                            dragDropIndicator.style.display='block';
                            break;
                        }
                    }
                }

                if(!indicateDestionationByUseOfArrow){
                    if(indicateDestinationBox.style.display=='none'){
                        indicateDestinationBox.style.display='block';
                        ulPositionArray[no]['obj'].appendChild(indicateDestinationBox);
                    }
                }else{
                    if(subLi.length>0 && dragDropIndicator.style.display=='none'){
                        dragDropIndicator.style.top = getTopPos(subLi[subLi.length-1]) + subLi[subLi.length-1].offsetHeight + tmpOffsetY + 'px';
                        dragDropIndicator.style.display='block';
                    }
                    if(subLi.length==0){
                        dragDropIndicator.style.top = ul_topPos + arrow_offsetY + 'px';
                        dragDropIndicator.style.display='block';
                    }
                }

                if(!destinationObj)destinationObj = ulPositionArray[no]['obj'];
                mouseoverObj = ulPositionArray[no]['obj'].parentNode;
                mouseoverObj.className='mouseover';
                return;
            }
        }
    }
}

function checkAnswers()
{
    for(var no=0;no<destinationBoxes.length;no++){
        var subLis = destinationBoxes[no].getElementsByTagName('LI');
        if(subLis.length<boxSizeArray[no])return;

        for(var no2=0;no2<subLis.length;no2++){
            if(subLis[no2].className=='wrongAnswer')return;
        }
    }
    everythingIsCorrect();
}

/* End dragging: put <LI> into a destination or back where it came from */
function dragDropEnd(e)
{
    if(dragTimer==-1)return;
    if(dragTimer<10){
        dragTimer = -1;
        return;
    }
    dragTimer = -1;
    if(document.all)e = event;
    if(destinationObj){
        var groupId = contentToBeDragged.getAttribute('groupId');
        if(!groupId)groupId = contentToBeDragged.groupId;

        var destinationToCheckOn = destinationObj;
        if(destinationObj.tagName!='UL'){
            destinationToCheckOn = destinationObj.parentNode;
        }

        var answerCheck = false;
        if(groupId == destinationToCheckOn.id){
            contentToBeDragged.className = 'correctAnswer';
            answerCheck=true;
        }else{
            contentToBeDragged.className = 'wrongAnswer';
        }
        if(destinationObj.id=='allItems' || destinationObj.parentNode.id=='allItems')contentToBeDragged.className='';

        if(destinationObj.tagName=='UL'){
            destinationObj.appendChild(contentToBeDragged);
        }else{
            destinationObj.parentNode.insertBefore(contentToBeDragged,destinationObj);
        }
        mouseoverObj.className='';
        destinationObj = false;
        dragDropIndicator.style.display='none';
        if(indicateDestinationBox){
            indicateDestinationBox.style.display='none';
            document.body.appendChild(indicateDestinationBox);
        }

        contentToBeDragged = false;

        if(answerCheck)checkAnswers();

        return;
    }
    if(contentToBeDragged_next){
        contentToBeDragged_src.insertBefore(contentToBeDragged,contentToBeDragged_next);
    }else{
        contentToBeDragged_src.appendChild(contentToBeDragged);
    }
    contentToBeDragged = false;
    dragDropIndicator.style.display='none';
    if(indicateDestinationBox){
        indicateDestinationBox.style.display='none';
        document.body.appendChild(indicateDestinationBox);
    }
    mouseoverObj = false;
}

/* Preparing data to be saved */
function saveDragDropNodes()
{
    var saveString = "";
    var uls = dragDropTopContainer.getElementsByTagName('UL');
    for(var no=0;no<uls.length;no++){
        var lis = uls[no].getElementsByTagName('LI');
        for(var no2=0;no2<lis.length;no2++){
            if(saveString.length>0)saveString = saveString + ";";
            saveString = saveString + uls[no].id + '|' + lis[no2].id;
        }
    }
    document.getElementById('saveContent').innerHTML = '<h1>Ready to save these nodes:</h1> ' + saveString.replace(/;/g,';<br>') + '<p>Format: ID of ul |(pipe) ID of li;(semicolon)</p>';
}

function initDragDropScript()
{
    dragContentObj = document.getElementById('dragContent');
    dragDropIndicator = document.getElementById('dragDropIndicator');
    dragDropTopContainer = document.getElementById('dhtmlgoodies_dragDropContainer');
    document.documentElement.onselectstart = cancelEvent;
    var listItems = dragDropTopContainer.getElementsByTagName('LI');
    var itemHeight = false;
    for(var no=0;no<listItems.length;no++){
        listItems[no].onmousedown = initDrag;
        listItems[no].onselectstart = cancelEvent;
        if(!itemHeight)itemHeight = listItems[no].offsetHeight;
        if(MSIE && navigatorVersion/1<6){
            listItems[no].style.cursor='hand';
        }
    }

    var mainContainer = document.getElementById('dhtmlgoodies_mainContainer');
    var uls = mainContainer.getElementsByTagName('UL');
    itemHeight = itemHeight + verticalSpaceBetweenListItems;
    for(var no=0;no<uls.length;no++){
        uls[no].style.height = itemHeight * boxSizeArray[no] + 'px';
        destinationBoxes[destinationBoxes.length] = uls[no];
    }

    document.documentElement.onmousemove = moveDragContent;
    document.documentElement.onmouseup = dragDropEnd;

    var ulArray = dragDropTopContainer.getElementsByTagName('UL');
    for(var no=0;no<ulArray.length;no++){
        ulPositionArray[no] = new Array();
        ulPositionArray[no]['obj'] = ulArray[no];
    }
    updatePositions();

    if(initShuffleItems){
        var allItemsObj = document.getElementById('allItems');
        var initItems = allItemsObj.getElementsByTagName('LI');

        for(var no=0;no<(initItems.length*10);no++){
            var itemIndex = Math.floor(Math.random()*initItems.length);
            allItemsObj.appendChild(initItems[itemIndex]);
        }
    }
    if(!indicateDestionationByUseOfArrow){
        indicateDestinationBox = document.createElement('LI');
        indicateDestinationBox.id = 'indicateDestination';
        indicateDestinationBox.style.display='none';
        document.body.appendChild(indicateDestinationBox);
    }
}


    function resetQuiz()
{
    var allItemsObj = document.getElementById('allItems');

    // Move every placed item back to the instruments list and clear red/green
    for(var no=0;no<destinationBoxes.length;no++){
        var placed = destinationBoxes[no].getElementsByTagName('LI');
        while(placed.length>0){
            placed[0].className = '';
            allItemsObj.appendChild(placed[0]);
        }
    }

    // Clear any leftover colors in the instruments list
    var listItems = allItemsObj.getElementsByTagName('LI');
    for(var no=0;no<listItems.length;no++){
        listItems[no].className = '';
    }

    // Clear any hover highlight or drag indicators
    if(mouseoverObj){ mouseoverObj.className = ''; mouseoverObj = false; }
    destinationObj = false;
    contentToBeDragged = false;
    dragDropIndicator.style.display = 'none';
    if(indicateDestinationBox) indicateDestinationBox.style.display = 'none';

    // Re-shuffle
    if(initShuffleItems){
        for(var no=0;no<(listItems.length*10);no++){
            var itemIndex = Math.floor(Math.random()*listItems.length);
            allItemsObj.appendChild(listItems[itemIndex]);
        }
    }

    document.getElementById('saveContent').innerHTML = '';
    updatePositions();
}

window.onload = initDragDropScript;
window.onresize = updatePositions;
	
	</script>
  
</head>
<body>
<h1 align="center">Instrumentation</h1>
<p> Drag-and-drop Instruments from the column in the appropriate Section box. Each box can contain only <span class="style1">3 items</span>. </p>
<div id="dhtmlgoodies_dragDropContainer" align='center'>
	<div id="dhtmlgoodies_listOfItems">
		<div class="">
			<p>Instruments</p>		
		<ul id="allItems">
			
		<li id="node7" groupid="box2">Flute</li><li class="" id="node15" groupid="box3">Snare Drum</li><li class="" id="node19" groupid="box1">Trumpet</li>
		<li id="node9" groupid="box1">Trombone</li><li class="" id="node10" groupid="box2">Clarinet</li><li class="" id="node8" groupid="box3">Bass Drum</li><li id="node3" groupid="box2">Saxophone</li><li id="node2" groupid="box3">Cymbal</li><li id="node16" groupid="box1">Tuba</li></ul>
		</div>
	</div>	
	<div id="dhtmlgoodies_mainContainer">
		<!-- ONE <UL> for each "room" -->
		<div class="">
			<p>Brass</p>
			<ul style="height: 72px;" id="box1">
			</ul>
		</div>
		<div class="">		
			<p>Woodwind</p>
			<ul style="height: 72px;" id="box2"></ul>
		</div>
		
		<div>
		  <p>Percussion</p>
			<ul style="height: 72px;" id="box3"></ul>
		</div>
		
		
	</div>
</div>
  
  <div id="resetWrap">
    <button type="button" id="resetBtn" onclick="resetQuiz()">Reset</button>
</div>
  
<ul id="dragContent" style="position:absolute; display:none; left:0; top:0; width:150px; margin:0; padding:0; list-style:none; z-index:1000; pointer-events:none;"></ul>
<div id="dragDropIndicator" style="position:absolute; display:none; left:0; top:0; z-index:1000;"><img src="insert.gif"></div>
<div id="saveContent"></div>
</body>
</html>
